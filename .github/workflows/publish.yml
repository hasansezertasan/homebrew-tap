---
name: brew pr-pull
on:
  # pull_request_target is required: `brew pr-pull` needs a write token to pull
  # bottles and push to main, which a fork's `pull_request` run cannot get. Safe
  # here because no PR code is ever checked out or executed — the job only runs
  # `brew pr-pull` against the labeled PR number, and the `pr-pull` label is
  # applied by a maintainer.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types:
      - labeled
# Deny-by-default; each job opts back into exactly what it needs.
permissions: {}
jobs:
  pr-pull:
    timeout-minutes: 15
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878  # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up git
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878  # main
      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
      - name: Push commits
        uses: Homebrew/actions/git-try-push@4790763c0a3ba4036f72634dc079c4a7dfcd4878  # main
        with:
          branch: main
      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"
