---
name: Scripts
# Unit tests for the stdlib helper scripts (scripts/gen_readme_packages.py).
# Kept separate from the Homebrew-native tests.yml
# (brew test-bot / bottle builds): this runs only when the Python scripts or
# their tests change. Formula, cask, and README edits also run the catalog
# freshness check; Cobo-managed file edits verify the lockfile.
on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "Formula/**"
      - "Casks/**"
      - "README.md"
      - ".gitignore"
      - "cobo.lock"
      - ".config/mise.toml"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "Formula/**"
      - "Casks/**"
      - "README.md"
      - ".gitignore"
      - "cobo.lock"
      - ".config/mise.toml"
      - ".github/workflows/scripts.yml"
# Deny-by-default; each job opts back into exactly what it needs.
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # This job only runs offline unit tests — no authenticated git ops — so
          # don't leave the checkout token configured in the workspace git config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check README packages table is up to date
        run: python scripts/gen_readme_packages.py --check
      # The Cobo version is pinned once, in .config/mise.toml.
      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5
        with:
          install: false
          cache: false
      - name: Check Cobo-managed boilerplate
        run: |
          mise trust .config/mise.toml
          mise install pipx:cobo uv
          mise exec -- cobo check --strict
