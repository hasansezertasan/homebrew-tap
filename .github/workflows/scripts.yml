---
name: Scripts
# Unit tests for the stdlib scaffolder scripts (scripts/add_formula.py,
# scripts/add_cask.py). Kept separate from the Homebrew-native tests.yml
# (brew test-bot / bottle builds): this runs only when the Python scripts or
# their tests change, so a formula/cask edit doesn't drag it in and vice versa.
on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "Formula/**"
      - "Casks/**"
      - "README.md"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "Formula/**"
      - "Casks/**"
      - "README.md"
      - ".github/workflows/scripts.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # This job only runs offline unit tests — no authenticated git ops — so
          # don't leave the checkout token configured in the workspace git config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Run scaffolder tests
        run: python -m unittest discover -s tests -v
      - name: Check README packages table is up to date
        run: python scripts/gen_readme_packages.py --check
